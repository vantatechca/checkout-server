# Render Blueprint — standby deployment of checkout-server.
#
# Purpose: an independent copy of this app, usable if the VPS goes down.
# Uses Render's native managed Postgres (Render has no managed MySQL/
# MariaDB product) — the app supports both dialects via DB_DIALECT in
# config.py; the VPS/staging keep running MySQL unchanged, only this
# deployment sets DB_DIALECT=postgres.
#
# This is its OWN database, separate from the VPS's — see RENDER_DEPLOY.md
# for exactly what that means and how to keep them in sync.
#
# Deploy: connect this repo in the Render dashboard → "New +" → "Blueprint".
# Render reads this file automatically. A few envVars marked `sync: false`
# below need real values pasted in manually after the first deploy (secrets
# are deliberately never written into this file, since it's committed to
# git) — see RENDER_DEPLOY.md for the exact list.

databases:
  - name: checkout-db
    databaseName: checkout_db
    user: checkout_user
    plan: basic-256mb   # smallest paid Postgres plan (Render retired the free/"starter" tier)
    diskSizeGB: 5

services:
  # ─── Redis — Celery broker/result-backend + rate-limit cache ─────────────
  # Not the source of truth for anything (Postgres is) — losing this data on
  # a restart just means in-flight background tasks and rate-limit counters
  # reset, not real data loss. ipAllowList: [] = no public access, internal
  # Render network only.
  - name: checkout-redis
    type: keyvalue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction   # never silently drop a queued task

  # ─── Web — the FastAPI app itself ─────────────────────────────────────────
  - name: checkout-web
    type: web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DB_DIALECT
        value: postgres
      - key: DB_HOST
        fromDatabase: { name: checkout-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: checkout-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: checkout-db, property: database }
      - key: DB_USER
        fromDatabase: { name: checkout-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: checkout-db, property: password }
      - key: REDIS_URL
        fromService:
          name: checkout-redis
          type: keyvalue
          property: connectionString
      - key: ENVIRONMENT
        value: production
      # Update to this service's real onrender.com URL (or a custom domain)
      # after the first deploy — used to build links in outgoing emails etc.
      - key: BASE_URL
        value: https://checkout-web.onrender.com
      # Admin dashboard login — required for the app to be usable at all.
      # Can differ from the VPS's admin credentials if you want that.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      # Every payment-processor/integration credential (Shopify, Stripe,
      # Helcim, Shippo, BTCPay, WPay, pymtz, NowPayments, Resend, Gmail,
      # ...) is deliberately NOT declared here. Each one already defaults
      # to blank/disabled in config.py exactly like an unconfigured .env
      # on any other environment — the app runs fine without them, those
      # specific features just stay off until you add real values in the
      # Render dashboard. Add only the ones you actually need for standby
      # use; see RENDER_DEPLOY.md for the full reference list.

  # ─── Worker — Celery worker + embedded beat (scheduled tasks) ────────────
  # `-B` runs the scheduler inside the same worker process — simplest setup
  # for a single, non-autoscaled standby instance. Do NOT scale this
  # service beyond 1 instance without splitting beat into its own service
  # first, or scheduled tasks (expire-old-orders) will fire once per
  # instance instead of once total.
  - name: checkout-worker
    type: worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks.celery_app worker -B --loglevel=info
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DB_DIALECT
        value: postgres
      - key: DB_HOST
        fromDatabase: { name: checkout-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: checkout-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: checkout-db, property: database }
      - key: DB_USER
        fromDatabase: { name: checkout-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: checkout-db, property: password }
      - key: REDIS_URL
        fromService:
          name: checkout-redis
          type: keyvalue
          property: connectionString
      - key: ENVIRONMENT
        value: production
